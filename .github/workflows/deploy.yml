name: Deploy Laravel App to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 1: Set up SSH key
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SF_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SF_LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      # Step 2: Deploy code (git pull from repo)
      - name: Deploy code to Lightsail
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa bitnami@${{ secrets.SF_LIGHTSAIL_HOST }} << 'EOF'
            cd /home/bitnami/htdocs
            if [ ! -d .git ]; then
              echo "No git repo found. Cloning repository..."
              git clone https://github.com/${{ github.repository }} .
            else
              echo "Updating existing repository..."
              git reset --hard
              git pull origin main
            fi
               echo "Running composer install..."
            composer install --no-dev --optimize-autoloader || (
              echo "Composer install failed. Running composer update instead..."
              composer update --no-dev --optimize-autoloader
          EOF

      # Step 3: Upload .env file
      - name: Upload .env to Lightsail
        run: |
          cp .env.example .env
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa .env bitnami@${{ secrets.SF_LIGHTSAIL_HOST }}:/home/bitnami/htdocs/.env.example
          rm .env.example  # remove after upload for security

      # Step 4: Run Laravel setup and restart services
      - name: Run Laravel setup commands
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa bitnami@${{ secrets.SF_LIGHTSAIL_HOST }} << 'EOF'
            cd /home/bitnami/htdocs
            php artisan key:generate
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo /opt/bitnami/ctlscript.sh restart php-fpm
            sudo /opt/bitnami/ctlscript.sh restart apache
          EOF
