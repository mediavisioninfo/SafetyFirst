name: Deploy Laravel App to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SF_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SF_LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy code to Lightsail
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa bitnami@${{ secrets.SF_LIGHTSAIL_HOST }} << 'EOF'
            cd /home/bitnami/htdocs   # adjust this path to your Laravel app folder
            git reset --hard
            git pull origin main
            composer install --no-dev --optimize-autoloader
          EOF

      - name: Upload .env to Lightsail
        run: |
          echo "${{ secrets.LARAVEL_ENV_FILE }}" > .env.example
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa .env bitnami@${{ secrets.SF_LIGHTSAIL_HOST }}:/opt/bitnami/htdocs/.env.example
          rm .env.example  # remove after upload for security

      - name: Run Laravel setup commands
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa bitnami@${{ secrets.SF_LIGHTSAIL_HOST }} << 'EOF'
            cd /opt/bitnami/htdocs
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo /opt/bitnami/ctlscript.sh restart php-fpm
            sudo /opt/bitnami/ctlscript.sh restart apache
          EOF
